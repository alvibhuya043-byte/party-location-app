<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Party Location Manager</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans Bengali",sans-serif;background:#f3f6fb;color:#172033}
header{background:#2563eb;color:white;padding:18px 16px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0002}
header h1{margin:0;font-size:21px} header p{margin:4px 0 0;opacity:.9;font-size:13px}
.container{max-width:760px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 12px #17203312}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 5px}
input,button{font:inherit}input[type=text],input[type=tel],input[type=file]{width:100%;padding:11px 12px;border:1px solid #d5dbea;border-radius:10px;background:#fff}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}
.primary{background:#2563eb;color:#fff}.secondary{background:#e8eefc;color:#1d4ed8}.danger{background:#fee2e2;color:#b91c1c}.muted{color:#667085;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1;min-width:90px}
.search{margin-bottom:12px}.party{overflow:hidden}.party img{width:72px;height:72px;object-fit:cover;border-radius:12px;float:left;margin-right:11px;background:#eef2f7}
.party h3{margin:0 0 3px;font-size:17px}.party p{margin:3px 0;font-size:14px;word-break:break-word}.clear{clear:both}
.map{margin-top:8px;border-radius:10px;overflow:hidden}.map a{display:block;text-align:center;background:#eef4ff;color:#1d4ed8;padding:9px;text-decoration:none;font-weight:700}
.empty{text-align:center;padding:28px 10px;color:#667085}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toolbar button{width:100%}
small{font-weight:400}
@media(min-width:600px){.toolbar{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><h1>📍 Party Location Manager</h1><p>নাম, পার্টি কোড, মোবাইল, লোকেশন ও ছবি সংরক্ষণ করুন</p></header>
<main class="container">
<section class="card">
  <h2 id="formTitle" style="margin:0 0 8px;font-size:18px">নতুন পার্টি যোগ করুন</h2>
  <form id="partyForm">
    <input type="hidden" id="editId">
    <label>নাম</label><input id="name" type="text" required placeholder="যেমন: রহিম">
    <div class="row">
      <div><label>পার্টি কোড</label><input id="code" type="text" required placeholder="যেমন: P-001"></div>
      <div><label>মোবাইল নাম্বার</label><input id="phone" type="tel" placeholder="01XXXXXXXXX"></div>
    </div>
    <label>লোকেশন / ঠিকানা</label><input id="location" type="text" placeholder="ঠিকানা বা এলাকার নাম">
    <label>ছবি</label><input id="picture" type="file" accept="image/*">
    <div class="muted">লোকেশন দিলে Google Maps-এ খোলা যাবে। ছবি আপনার ফোনের ব্রাউজারেই রাখা হবে।</div>
    <div class="actions">
      <button class="primary" type="submit">💾 সংরক্ষণ</button>
      <button class="secondary" type="button" id="useGPS">📍 বর্তমান লোকেশন</button>
      <button class="secondary" type="button" id="cancelEdit" style="display:none">✖ বাতিল</button>
    </div>
  </form>
</section>

<section class="card">
  <div class="toolbar">
    <button class="secondary" id="exportBtn">⬇️ JSON Export</button>
    <button class="secondary" id="importBtn">⬆️ JSON Import</button>
    <button class="danger" id="clearBtn">🗑️ সব মুছুন</button>
    <button class="secondary" id="installBtn" style="display:none">📱 Home Screen</button>
  </div>
  <input id="fileImport" type="file" accept=".json,application/json" hidden>
</section>

<section>
  <input class="search" id="search" type="text" placeholder="🔎 নাম / পার্টি কোড / মোবাইল / লোকেশন দিয়ে খুঁজুন">
  <div id="list"></div>
</section>
</main>

<script>
const KEY="party_location_manager_v1";
let data=JSON.parse(localStorage.getItem(KEY)||"[]");
let currentPhoto="";
let deferredPrompt=null;

const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(data));render();}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function mapsUrl(loc){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(loc);}
function render(){
  const q=$("search").value.trim().toLowerCase();
  const list=data.filter(x=>[x.name,x.code,x.phone,x.location].join(" ").toLowerCase().includes(q));
  $("list").innerHTML=list.length?list.map(x=>`
  <article class="card party">
    ${x.photo?`<img src="${x.photo}" alt="ছবি">`:``}
    <h3>${esc(x.name)}</h3>
    <p><b>পার্টি কোড:</b> ${esc(x.code)}</p>
    <p><b>মোবাইল:</b> ${x.phone?`<a href="tel:${esc(x.phone)}">${esc(x.phone)}</a>`:"—"}</p>
    <p><b>লোকেশন:</b> ${esc(x.location||"—")}</p>
    ${x.location?`<div class="map"><a target="_blank" rel="noopener" href="${mapsUrl(x.location)}">🗺️ Google Maps-এ খুলুন</a></div>`:""}
    <div class="actions">
      <button class="secondary" onclick="editParty('${x.id}')">✏️ Edit</button>
      <button class="danger" onclick="deleteParty('${x.id}')">🗑️ Delete</button>
    </div><div class="clear"></div>
  </article>`).join(""):`<div class="card empty">কোনো তথ্য পাওয়া যায়নি।<br>উপরের ফর্ম থেকে নতুন পার্টি যোগ করুন।</div>`;
}
$("partyForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const file=$("picture").files[0];
 if(file) currentPhoto=await resizeImage(file);
 const id=$("editId").value||crypto.randomUUID();
 const old=data.find(x=>x.id===id);
 const obj={id,name:$("name").value.trim(),code:$("code").value.trim(),phone:$("phone").value.trim(),location:$("location").value.trim(),photo:currentPhoto||(old?.photo||""),updatedAt:new Date().toISOString()};
 const i=data.findIndex(x=>x.id===id); i>=0?data[i]=obj:data.unshift(obj);
 save(); resetForm();
});
function resetForm(){ $("partyForm").reset();$("editId").value="";currentPhoto="";$("formTitle").textContent="নতুন পার্টি যোগ করুন";$("cancelEdit").style.display="none"; }
window.editParty=id=>{const x=data.find(a=>a.id===id);if(!x)return;$("editId").value=x.id;$("name").value=x.name;$("code").value=x.code;$("phone").value=x.phone;$("location").value=x.location;currentPhoto=x.photo||"";$("formTitle").textContent="পার্টি এডিট করুন";$("cancelEdit").style.display="block";scrollTo({top:0,behavior:"smooth"});}
window.deleteParty=id=>{if(confirm("এই তথ্যটি মুছে ফেলবেন?")){data=data.filter(x=>x.id!==id);save();}}
$("cancelEdit").onclick=resetForm;
$("search").oninput=render;
$("clearBtn").onclick=()=>{if(data.length&&confirm("সব পার্টির তথ্য মুছে ফেলবেন?")){data=[];save();}}
$("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="party-data.json";a.click();URL.revokeObjectURL(a.href);}
$("importBtn").onclick=()=>$("fileImport").click();
$("fileImport").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const arr=JSON.parse(await f.text());if(!Array.isArray(arr))throw Error();data=arr.map(x=>({...x,id:x.id||crypto.randomUUID()}));save();alert("JSON Import সফল হয়েছে।");}catch{alert("সঠিক JSON ফাইল দিন।")}e.target.value="";}
$("useGPS").onclick=()=>{if(!navigator.geolocation){alert("এই ব্রাউজারে GPS নেই।");return}navigator.geolocation.getCurrentPosition(p=>{$("location").value=`${p.coords.latitude.toFixed(6)}, ${p.coords.longitude.toFixed(6)}`;},()=>alert("লোকেশন অনুমতি দিন বা GPS চালু করুন।"),{enableHighAccuracy:true,timeout:10000});}
function resizeImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),max=700,s=Math.min(1,max/Math.max(im.width,im.height));c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.78));};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file);});}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;$("installBtn").style.display="block";});
$("installBtn").onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;$("installBtn").style.display="none";}};
render();

if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
</script>
</body>
</html>
